<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3ペイン・完全修正最終版</title>
  
  <!-- 🎨 ここに【2/3】のCSSデザインを丸ごと貼り付けます -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
    }

    /* 全体を管理する大枠コンテナ */
    #app-container {
      width: 100vw;
      height: calc(var(--vh, 1vh) * 100);
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: center center;
      box-sizing: border-box;
      overflow: hidden;
    }

    #app-container:fullscreen {
      background-color: #000 !important;
    }

    /* スマホ実機の横向き回転制御 */
    #app-container.force-portrait {
      transform: rotate(-90deg);
      width: calc(var(--vh, 1vh) * 100);
      height: 100vw;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-90deg);
    }

    /* 👑 固定ヘッダー・フッター（明るいグレー・透過なし・最前面 z-index: 40） */
    .bar {
      height: 56px;
      min-height: 56px;
      background: #dcdcdc; 
      color: #000000; 
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      position: absolute;
      left: 0;
      width: 100%;
      z-index: 40;
      box-sizing: border-box;
      letter-spacing: 0.05em;
    }
    .header-bar { top: 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
    .footer-bar { bottom: 0; border-top: 1px solid rgba(0,0,0,0.1); }

    .fullscreen-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(0, 0, 0, 0.3);
      color: #000000;
      padding: 6px 16px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      z-index: 50;
    }
    .fullscreen-btn:hover { background: rgba(0, 0, 0, 0.25); }

    /* 📦 縦スクロールバーを画面右端に「1つだけ」出現させるメイン領域。
       高さをヘッダー・フッターの間に完璧に閉じ込めます。 */
    .main-content {
      position: absolute;
      top: 56px;
      bottom: 56px;
      left: 0;
      width: 100%;
      overflow-y: auto; 
      overflow-x: hidden;
      z-index: 10;

      /* 🖼️ 巨大な壁紙シートをここに配置。これで文字と一緒に背景パターンも完全に連動して上下します */
      background-image: url('doodle-tile-240px.png');
      background-size: 480px 480px;
      background-repeat: repeat;
      background-position: top left;
      background-attachment: local; 
    }

    /* 📋 3つのペインを横並びにする枠（長い紙） */
    .viewport-wrapper {
      display: grid;
      width: 100%;
      height: auto;
      min-height: 100%;
      box-sizing: border-box;
      padding-top: 0; 
      padding-bottom: 0; 
    }

    /* PCワイド表示モード */
    .viewport-wrapper.pc-mode {
      grid-template-columns: 360px 1fr 360px;
    }
    .viewport-wrapper.pc-mode .pane { width: auto; }

    /* 📱 スマホ & PC縮小スワイプ（ちょい見せ）モード */
    .viewport-wrapper.mobile-mode {
      display: flex;
      overflow-x: auto; 
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      align-items: stretch; /* 🛠️ 重要：これで左右中のペインの高さ（最下部）が完全に一直線に揃います */
    }
    
    /* 下に落ちて画面を壊してしまうブラウザ固有の横バーを完全に非表示（消去）にします */
    .viewport-wrapper.mobile-mode::-webkit-scrollbar { display: none; }
    .viewport-wrapper.mobile-mode { -ms-overflow-style: none; scrollbar-width: none; }

    /* ちょい見せモード時の左右の動的スペーサー */
    .viewport-wrapper.mobile-mode::before,
    .viewport-wrapper.mobile-mode::after {
      content: '';
      flex: 0 0 calc((100% - 360px) / 2);
    }
    .viewport-wrapper.mobile-mode.ready { scroll-behavior: smooth; }
    
    /* すべてのペインを360px固定 */
    .viewport-wrapper.mobile-mode .pane {
      flex: 0 0 360px;
      width: 360px;
      scroll-snap-align: center;
      max-width: 100%; 
    }

    /* 壁紙の上に乗る各ペインの透明なトレイ（透過率90%） */
    .pane {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      position: relative;
      box-sizing: border-box;
      padding: 20px 20px 60px 20px;
    }

    .pane-scroll-box {
      width: 100%;
      height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .width-display {
      font-size: 3.5rem;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 20px;
      border-radius: 10px;
      margin: 15px 0;
    }

    .left-pane   { background-color: rgba(44, 62, 80, 0.9); }
    .center-pane { background-color: rgba(39, 174, 96, 0.9); }
    .right-pane  { background-color: rgba(142, 68, 173, 0.9); }

    /* 🎯 ドットインジケーター */
    .nav-dots {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 30;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 20px;
      pointer-events: none;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transition: all 0.3s ease;
    }
    .dot.active {
      background: #ffffff;
      transform: scale(1.3);
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
    }

    /* 🎛️ ✨ フッターのすぐ上に100%完全に固定表示されるデザイン横スクロールバー */
    .custom-scrollbar-container {
      position: absolute;
      bottom: 56px; 
      left: 0;
      width: 100%;
      height: 12px;
      background: rgba(0, 0, 0, 0.2);
      z-index: 35;
      display: none; 
      touch-action: none; /* スマホでの誤動作を防止 */
    }
    .custom-scroll-thumb {
      height: 100%;
      width: 30%; 
      background: rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      transition: background 0.2s;
      cursor: pointer;
    }
  </style>

</head>
<body>

  <!-- すべての要素を包む大枠コンテナ -->
  <div id="app-container">
    
    <!-- 固定ヘッダー (56px) -->
    <div class="bar header-bar">ヘッダーテキスト（56px）</div>

    <!-- メインコンテンツエリア（上下のバーの間にぴったり配置） -->
    <div class="main-content">
      <div class="viewport-wrapper pc-mode" id="wrapper">
        
        <!-- 左ペイン -->
        <div class="pane left-pane" id="pane-left">
          <div class="pane-scroll-box">
            <h2>左ペイン</h2>
            <p>幅: 360px 固定</p>
            <div style="height: 800px; display: flex; align-items: center; justify-content: center; border: 1px dashed rgba(255,255,255,0.3); width: 100%;">
              左：縦に長いコンテンツ領域
            </div>
            <p>左ペインの最下部です</p>
          </div>
        </div>
        
        <!-- 中央ペイン -->
        <div class="pane center-pane" id="pane-center">
          <div class="pane-scroll-box">
            <h2>中央ペイン</h2>
            <div class="width-display" id="center-width">--- px</div>
            <p id="mode-text">PCモード</p>
            <div style="height: 1200px; display: flex; align-items: center; justify-content: center; border: 1px dashed rgba(255,255,255,0.3); width: 100%; margin: 20px 0;">
              中央：さらに縦に長いコンテンツ領域
            </div>
            <p>中央ペインの最下部です</p>
          </div>
        </div>
        
        <!-- 右ペイン -->
        <div class="pane right-pane" id="pane-right">
          <div class="pane-scroll-box">
            <h2>右ペイン</h2>
            <p>幅: 360px 固定</p>
            <div style="height: 600px; display: flex; align-items: center; justify-content: center; border: 1px dashed rgba(255,255,255,0.3); width: 100%;">
              右：縦に長いコンテンツ領域
            </div>
            <p>右ペインの最下部です</p>
          </div>
        </div>

      </div>
    </div>

    <!-- フッターの上に浮かぶカスタム横スクロールバー -->
    <div class="custom-scrollbar-container" id="custom-scrollbar">
      <div class="custom-scroll-thumb" id="scroll-thumb"></div>
    </div>

    <!-- スマホモード用のドットインジケーター -->
    <div class="nav-dots">
      <div class="dot" id="dot-left"></div>
      <div class="dot active" id="dot-center"></div>
      <div class="dot" id="dot-right"></div>
    </div>

    <!-- 固定フッター (56px) -->
    <div class="bar footer-bar">
      フッターテキスト（56px）
      <button class="fullscreen-btn" id="toggle-fullscreen">拡</button>
    </div>

  </div>

  <!-- ⚙️ ここに【3/3】のJavaScriptを丸ごと貼り付けます -->
  <script>
    const appContainer = document.getElementById('app-container');
    const wrapper = document.getElementById('wrapper');
    const centerPane = document.getElementById('pane-center');
    const centerWidthText = document.getElementById('center-width');
    const modeText = document.getElementById('mode-text');
    const fullscreenBtn = document.getElementById('toggle-fullscreen');
    const customScrollbar = document.getElementById('custom-scrollbar');
    const scrollThumb = document.getElementById('scroll-thumb');
    
    const dots = {
      left: document.getElementById('dot-left'),
      center: document.getElementById('dot-center'),
      right: document.getElementById('dot-right')
    };

    let currentMode = 'pc';

    // 全画面切り替えの制御
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        appContainer.requestFullscreen().catch(err => alert(`全画面エラー: ${err.message}`));
      } else {
        document.exitFullscreen();
      }
    });

    // 全画面状態のリアクティブ監視
    document.addEventListener('fullscreenchange', () => {
      fullscreenBtn.textContent = document.fullscreenElement ? '縮' : '拡';
      updateRealViewportHeight();
      
      // 🛠️ 修正：システムバグを100%回避する安全な文字列変換形式を維持したまま、
      // 50ms、150ms、300ms、500msの4回に分けて高さを連続で再計算します。
      // これにより、スマホのアドレスバーがゆっくり出現し終わった後の高さを完全に捉え、フッターの消失を防ぎます。
      const t1 = parseInt("5" + "0", 10);
      const t2 = parseInt("1" + "5" + "0", 10);
      const t3 = parseInt("3" + "0" + "0", 10);
      const t4 = parseInt("5" + "0" + "0", 10);
      const retryDelays = [t1, t2, t3, t4];
      
      retryDelays.forEach(delay => {
        setTimeout(() => {
          updateRealViewportHeight();
          if (currentMode === 'mobile') scrollToCenter();
        }, delay);
      });
    });

    // モバイル端末であるかを判定する関数
    function isMobileDevice() {
      return /Mobi|Android|iPhone|iPad|Macintosh/i.test(navigator.userAgent) && ('ontouchstart' in window || navigator.maxTouchPoints > 0);
    }

    // スマホモードの際、中央ペインにぴったりスクロール位置を合わせる関数
    function scrollToCenter() {
      wrapper.classList.remove('ready');
      const containerWidth = appContainer.offsetWidth;
      const spacerWidth = (containerWidth - 360) / 2;
      wrapper.scrollLeft = centerPane.offsetLeft - (spacerWidth > 0 ? spacerWidth : 0);
      setTimeout(() => { wrapper.classList.add('ready'); updateCustomScrollbar(); }, 50);
    }

    // アドレスバーを除いた本当の画面高さを計算してCSSへ伝える関数
    function updateRealViewportHeight() {
      const isLandscape = window.innerWidth > window.innerHeight;
      let vh;
      if (isMobileDevice() && isLandscape) {
        vh = window.innerWidth * 0.01;
        appContainer.classList.add('force-portrait');
      } else {
        vh = window.innerHeight * 0.01;
        appContainer.classList.remove('force-portrait');
      }
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }

    // 擬似横スクロールバーの位置を実際のスワイプ量とリアルタイム同期させる関数
    function updateCustomScrollbar() {
      if (currentMode === 'pc') return;
      const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
      if (maxScroll <= 0) return;
      
      const percentage = wrapper.scrollLeft / maxScroll;
      const thumbWidth = scrollThumb.offsetWidth;
      const availableSpace = customScrollbar.offsetWidth - thumbWidth;
      
      scrollThumb.style.transform = `translateX(${availableSpace * percentage}px)`;
    }

    // 画面サイズ・表示モードを常時監視し、レイアウトを自動制御
    const resizeObserver = new ResizeObserver(() => {
      updateRealViewportHeight();
      
      const centerWidth = Math.round(centerPane.getBoundingClientRect().width);
      
      // ✨ 修正：スワイプモードに突入しても数値が1080pxへ跳ね上がらず、360px固定を常に正しくホールド表示します
      centerWidthText.textContent = `${centerWidth} px`;

      const baseWidth = appContainer.classList.contains('force-portrait') ? window.innerHeight : window.innerWidth;

      // PCワイドからスワイプモードへの切り替え判定
      if (currentMode === 'pc' && centerWidth < 360) {
        currentMode = 'mobile';
        wrapper.className = 'viewport-wrapper mobile-mode';
        modeText.textContent = 'スワイプモード（360px固定・チラ見せ）';
        document.querySelector('.nav-dots').style.display = 'flex';
        customScrollbar.style.display = 'block'; 
        scrollToCenter();
      } 
      // スワイプモードからPCワイドへの復帰判定
      else if (currentMode === 'mobile' && baseWidth > 1080) {
        currentMode = 'pc';
        wrapper.className = 'viewport-wrapper pc-mode';
        modeText.textContent = 'PCモード';
        document.querySelector('.nav-dots').style.display = 'none';
        customScrollbar.style.display = 'none'; 
        wrapper.scrollLeft = 0;
      }
      
      if (currentMode === 'mobile') scrollToCenter();
    });

    resizeObserver.observe(document.body);
    updateRealViewportHeight();

    // 左右スワイプ（スクロール）時のリアルタイム同期処理
    wrapper.addEventListener('scroll', () => {
      updateCustomScrollbar(); 
      
      if (currentMode === 'pc') return;
      const scrollLeft = wrapper.scrollLeft;
      const containerWidth = appContainer.offsetWidth;
      const wrapperCenter = scrollLeft + (containerWidth / 2);
      
      const panes = [
        { key: 'left', el: document.getElementById('pane-left') },
        { key: 'center', el: centerPane },
        { key: 'right', el: document.getElementById('pane-right') }
      ];

      let currentPane = 'center';
      let minDistance = Infinity;

      panes.forEach(pane => {
        const paneCenter = pane.el.offsetLeft + (pane.el.offsetWidth / 2);
        const distance = Math.abs(wrapperCenter - paneCenter);
        if (distance < minDistance) {
          minDistance = distance;
          currentPane = pane.key;
        }
      });

      Object.keys(dots).forEach(key => {
        dots[key].classList.toggle('active', key === currentPane);
      });
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => { updateRealViewportHeight(); if (currentMode === 'mobile') scrollToCenter(); }, 200);
    });

    // 🎛️ ✨ 新機能：擬似横スクロールバーを直接ドラッグして操作できるようにする処理
    let isDraggingThumb = false;
    let startX = 0;
    let startScrollLeft = 0;

    customScrollbar.addEventListener('pointerdown', (e) => {
      if (currentMode === 'pc') return;
      isDraggingThumb = true;
      customScrollbar.setPointerCapture(e.pointerId); 
      
      if (e.target === scrollThumb) {
        startX = e.clientX;
        startScrollLeft = wrapper.scrollLeft;
      } else {
        const rect = customScrollbar.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const percentage = clickX / customScrollbar.offsetWidth;
        const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
        wrapper.scrollLeft = maxScroll * percentage;
        
        startX = e.clientX;
        startScrollLeft = wrapper.scrollLeft;
      }
      scrollThumb.style.background = 'rgba(0, 0, 0, 0.6)';
    });

    customScrollbar.addEventListener('pointermove', (e) => {
      if (!isDraggingThumb) return;
      const deltaX = e.clientX - startX;
      const thumbWidth = scrollThumb.offsetWidth;
      const availableSpace = customScrollbar.offsetWidth - thumbWidth;
      if (availableSpace <= 0) return;
      
      const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
      const scrollDelta = (deltaX / availableSpace) * maxScroll;
      wrapper.scrollLeft = startScrollLeft + scrollDelta;
    });

    const stopDragging = (e) => {
      if (!isDraggingThumb) return;
      isDraggingThumb = false;
      customScrollbar.releasePointerCapture(e.pointerId);
      scrollThumb.style.background = 'rgba(0, 0, 0, 0.4)'; 
    };

    customScrollbar.addEventListener('pointerup', stopDragging);
    customScrollbar.addEventListener('pointercancel', stopDragging);
  </script>

</body>
</html>
